services:
  # PostgreSQL with pgVector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tamil-assistant-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tamil_assistant
      - POSTGRES_USER=tamil_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tamil_password_dev}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # Auto-run migration scripts
    networks:
      - tamil-assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamil_user -d tamil_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: tamil-assistant-minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console UI
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-tamil_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-tamil_minio_password_dev}
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - tamil-assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for session caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: tamil-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tamil_redis_password_dev}
    networks:
      - tamil-assistant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend (FastAPI + FAISS + PostgreSQL + MinIO)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamil-assistant-backend
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/data          # Named volume for FAISS persistence (migration period)
      - ./backend:/app/backend         # Hot-reload for development
      - ./models:/app/models:ro        # Read-only access to models
      - ./credentials:/app/credentials:ro  # Google Cloud TTS credentials
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account-key.json
      - PYTHONUNBUFFERED=1
      # Database configuration
      - DATABASE_URL=postgresql+asyncpg://tamil_user:${POSTGRES_PASSWORD:-tamil_password_dev}@postgres:5432/tamil_assistant
      - DATABASE_ECHO=false
      # MinIO configuration
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-tamil_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-tamil_minio_password_dev}
      - MINIO_SECURE=false
      # Redis configuration
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tamil_redis_password_dev}@redis:6379/0
      # JWT configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-tamil_jwt_secret_dev_change_in_production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - tamil-assistant-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./app/nextjs
      dockerfile: Dockerfile
    container_name: tamil-assistant-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./app/nextjs:/app              # Hot-reload for development
      - /app/node_modules              # Don't override node_modules
      - /app/.next                     # Don't override build cache
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - tamil-assistant-network
    restart: unless-stopped

  # Ollama (LLM inference)
  ollama:
    image: ollama/ollama:latest
    container_name: tamil-assistant-ollama
    ports:
      - "11435:11434"  # Using 11435 (system Ollama uses 11434)
    volumes:
      - ollama_data:/root/.ollama      # Persist Ollama models
      - ./models/llm:/models:ro        # Mount local GGUF models
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - tamil-assistant-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G  # Reduced from 8G to be more conservative
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  # Existing volumes (preserved for migration)
  faiss_data:
    name: tamil-assistant-faiss
    driver: local
  ollama_data:
    name: tamil-assistant-ollama
    driver: local

  # New volumes for user management system
  postgres_data:
    name: tamil-assistant-postgres
    driver: local
  minio_data:
    name: tamil-assistant-minio
    driver: local
  redis_data:
    name: tamil-assistant-redis
    driver: local

networks:
  tamil-assistant-network:
    name: tamil-assistant-network
    driver: bridge
